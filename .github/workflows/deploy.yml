name: Build and Deploy

on:
  push:
    branches: [main]
    # Diese Pfade liegen laut `.dockerignore` nicht im Build-Kontext und
    # koennen das Image nicht veraendern. `.github/**` ist bewusst **nicht**
    # ausgenommen: eine Aenderung am Workflow soll ihn ausfuehren, sonst faellt
    # ein Fehler darin erst beim naechsten Code-Commit auf.
    # `plugin/**` ist bewusst **nicht** ausgenommen: die App liefert den Skill
    # als ZIP aus, also muss eine Aenderung daran ein neues Image bauen.
    paths-ignore:
      - 'doc/**'
      - 'README.md'
  # Notausgang: erzwingt einen Build ohne Code-Aenderung.
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  build:
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Nur amd64: der Zielserver ist x86_64. sharp bringt native Binaries
          # mit, und ein arm64-Build liefe unter QEMU — Minuten Bauzeit fuer
          # ein Image, das niemand startet.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Webhook ausloesen
        run: |
          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Token: ${{ secrets.WEBHOOK_SECRET }}" \
            -d '{"ref": "${{ github.ref }}", "event": "push", "sha": "${{ github.sha }}"}' \
            https://webhook.mrtimeey.com/hooks/ai-image-generator
