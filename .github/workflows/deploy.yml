name: Deploy

# Das Image entsteht auf dem Server selbst (kein Registry-Push), deshalb
# genuegt hier ein Anstoss: der webhook-Container zieht den neuen Stand und
# fuehrt dockers_update.sh aus.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  deploy:
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Webhook ausloesen
        run: |
          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Token: ${{ secrets.WEBHOOK_SECRET }}" \
            -d '{"ref": "${{ github.ref }}", "event": "push", "sha": "${{ github.sha }}"}' \
            https://webhook.mrtimeey.com/hooks/ai-image-generator
