services:

  ai-image-generator:
    # Das Image baut die CI und legt es in der GitHub Registry ab. Der Server
    # zieht nur — er hat knapp 5 GB frei, und `npm ci` samt Build dort waere
    # jedes Mal ein Risiko.
    image: ghcr.io/mrtimeey/ai-image-generator:latest
    container_name: aiImageGenerator
    restart: always
    # Kein ports-Mapping: der Nginx Proxy Manager haengt im selben Netz und
    # spricht den Container ueber seinen Namen an.
    environment:
      - AI_IMAGE_GENERATOR_PORT=3000
      - AI_IMAGE_GENERATOR_OUTPUT_PATH=/app/images
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - OPEN_AI_API_KEY=${OPEN_AI_API_KEY}
      - OPEN_AI_ORG_ID=${OPEN_AI_ORG_ID}
      - OPEN_AI_ADMIN_KEY=${OPEN_AI_ADMIN_KEY}
      - BFL_API_KEY=${BFL_API_KEY}
      - AUTH_ENABLED=true
      - OIDC_ISSUER=${OIDC_ISSUER}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_ALLOWED_GROUP=${OIDC_ALLOWED_GROUP}
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - "./../ai-images:/app/images"
      - "./../ai-images/thumbnails:/app/src/static/thumbnails"
      - "./../ai-images/big-thumbnails:/app/src/static/big-thumbnails"

networks:
  default:
    name: mrtimeey
    external: true
