<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator</title>
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/public/favicon_io/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/public/favicon_io/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/public/favicon_io/favicon-16x16.png" />
    <link rel="manifest" href="/public/favicon_io/site.webmanifest" />
    <meta name="theme-color" content="#2563eb">
    <script>
        // Nur ueber https oder localhost — sonst verweigert der Browser die
        // Registrierung ohnehin und wirft eine Konsolenmeldung.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch((error) =>
                    console.debug('Service Worker nicht registriert', error));
            });
        }
    </script>
    <script src="/public/js/toast.js" defer></script>
    <script src="/public/js/nav.js" defer></script>
    <script src="/js/main.js" defer></script>
    <link href="/public/css/generated-tailwind.css" rel="stylesheet">
    <link href="/public/css/style.css" rel="stylesheet">
</head>
<body class="bg-gray-100">

<!-- Spinner Overlay -->
<div id="spinner-overlay" class="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center z-50">
    <div class="w-16 h-16 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
</div>

<header class="bg-blue-600 text-white">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
        <!-- Logo und Titel -->
        <div class="text-2xl font-bold">
            <a href="/index.html">AI Image Generator</a>
        </div>

        <!-- Navigation (Desktop) -->
        <nav id="nav-desktop" class="hidden md:flex space-x-6 items-center"></nav>

        <!-- Burger Menu Button (Mobile) -->
        <div class="md:hidden">
            <button id="burger-btn" class="focus:outline-none">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Navigation (Mobile) -->
    <nav id="mobile-menu" class="hidden bg-blue-600 md:hidden px-4 py-4">
        <div id="nav-mobile"></div>
    </nav>
</header>

<div id="toast" class="toast"></div>

<!-- Bild Detailansicht -->
<main class="max-w-4xl mx-auto py-10 px-4 bg-white shadow-lg rounded-lg">
    <!-- Bildanzeige -->
    <div class="text-center mb-4">
        <a id="anchor"><img id="image" alt="Generiertes Bild" class="w-512 mx-auto"></a>
    </div>

    <!-- Bl&auml;ttern -->
    <div class="flex items-center justify-between mb-4">
        <a id="prev-image" class="hidden text-blue-600 hover:underline">&larr; neueres Bild</a>
        <div class="flex-1"></div>
        <a id="next-image" class="hidden text-blue-600 hover:underline">&auml;lteres Bild &rarr;</a>
    </div>

    <div class="flex flex-wrap justify-center gap-3 mb-6">
        <a id="use-as-reference"
           class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700">Als Referenz nutzen</a>
        <a id="download-link" class="bg-gray-200 text-gray-800 px-5 py-2 rounded-lg hover:bg-gray-300">Herunterladen</a>
        <button id="favorite-toggle" class="bg-white border border-gray-300 px-5 py-2 rounded-lg hover:bg-gray-50">
            <span id="favorite-icon">&#9734;</span> <span id="favorite-label">Favorit</span>
        </button>
        <button id="delete-image" class="bg-white border border-red-300 text-red-700 px-5 py-2 rounded-lg hover:bg-red-50">L&ouml;schen</button>
    </div>

    <div id="msg-container" class="hidden w-full flex items-center justify-center">
        <h2 id="msg"></h2>
    </div>

    <!-- Bildinformationen -->
    <div class="space-y-4 text-gray-700">
        <!-- Prompt -->
        <div>
            <div class="flex items-center gap-3">
                <h3 class="font-semibold text-lg">Prompt:</h3>
                <button id="copy-prompt" class="text-sm text-blue-600 hover:underline">kopieren</button>
            </div>
            <p id="prompt">...</p>
        </div>

        <!-- Revised Prompt -->
        <div>
            <div class="flex items-center gap-3">
                <h3 class="font-semibold text-lg">Revised Prompt:</h3>
                <button id="copy-revised" class="text-sm text-blue-600 hover:underline">kopieren</button>
            </div>
            <p id="revised-prompt">...</p>
        </div>

        <!-- Dateiname -->
        <div>
            <h3 class="font-semibold text-lg">Dateiname:</h3>
            <p id="filename">...</p>
        </div>

        <!-- Referenzbilder -->
        <div id="reference-block" class="hidden">
            <h3 class="font-semibold text-lg">Referenzbilder:</h3>
            <p class="text-sm text-gray-500 mb-2">Vorlagen, die bei der Erzeugung mitgegeben wurden.</p>
            <div id="reference-images" class="flex flex-wrap gap-3"></div>
        </div>

        <!-- Modell -->
        <div>
            <h3 class="font-semibold text-lg">Modell:</h3>
            <p id="model">...</p>
        </div>

        <!-- Einstellungen und Kosten -->
        <div>
            <h3 class="font-semibold text-lg">Erzeugung:</h3>
            <p id="settings">...</p>
            <p id="seed-line" class="hidden mt-1">
                <span class="text-gray-600">Seed:</span>
                <code id="seed-value"></code>
                <a id="seed-again" class="ml-2 text-blue-600 hover:underline" href="#">nochmal mit diesem Seed</a>
            </p>
        </div>

        <!-- Erstellungsdatum -->
        <div>
            <h3 class="font-semibold text-lg">Erstellt am:</h3>
            <p id="created">...</p>
        </div>
    </div>
</main>

<script>
    const spinnerOverlay = document.getElementById('spinner-overlay');

    /** Favorit auch hier setzen — nicht nur im Raster. */
    const zeigeFavorit = (image) => {
        const knopf = document.getElementById('favorite-toggle');
        const zeichne = (gesetzt) => {
            document.getElementById('favorite-icon').textContent = gesetzt ? '★' : '☆';
            document.getElementById('favorite-label').textContent = gesetzt ? 'Favorit' : 'Als Favorit';
            knopf.classList.toggle('text-amber-600', gesetzt);
            knopf.classList.toggle('border-amber-300', gesetzt);
            knopf.title = gesetzt ? 'Markierung aufheben' : 'Als Favorit markieren';
        };
        let gesetzt = Boolean(image.favorite);
        zeichne(gesetzt);

        knopf.addEventListener('click', async () => {
            try {
                const response = await fetch(`/api/files/${encodeURIComponent(image.filename)}/favorite`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ favorite: !gesetzt }),
                });
                if (!response.ok) {
                    const daten = await response.json().catch(() => ({}));
                    showToast(daten.message ?? 'Markieren fehlgeschlagen');
                    return;
                }
                gesetzt = !gesetzt;
                zeichne(gesetzt);
            } catch (error) {
                showToast(`Markieren fehlgeschlagen: ${error.message}`);
            }
        });
    };

    /** Kosten lesbar: Credits ganzzahlig genug, Dollar in Cent-Genauigkeit. */
    const kostenText = (kosten) => {
        if (!kosten || kosten.amount === undefined || kosten.amount === null) return null;
        if (kosten.unit === 'credits') return `${kosten.amount.toLocaleString('de-DE')} Credits`;
        if (kosten.unit === 'usd') {
            // Unter einem Cent sonst nur „0,00 $".
            const stellen = kosten.amount < 0.01 ? 4 : 2;
            return `${kosten.amount.toLocaleString('de-DE', { minimumFractionDigits: stellen, maximumFractionDigits: stellen })} $`;
        }
        return String(kosten.amount);
    };

    const zeigeEinstellungen = (image) => {
        const teile = [];
        if (image.quality) teile.push(`Qualität ${image.quality}`);
        if (image.outputFormat) teile.push(image.outputFormat);
        const kosten = kostenText(image.cost);
        if (kosten) teile.push(`Kosten ${kosten}`);
        if (image.durationMs) teile.push(`${(image.durationMs / 1000).toFixed(1)} s`);
        // Altdaten kennen nichts davon — dann eine ehrliche Zeile statt einer
        // leeren.
        document.getElementById('settings').textContent = teile.length
            ? teile.join(' · ')
            : 'Für dieses Bild wurden keine Einstellungen aufgezeichnet.';

        if (image.seed === undefined || image.seed === null) return;
        document.getElementById('seed-value').textContent = image.seed;
        // Derselbe Weg wie „Als Referenz nutzen", nur mit Seed und Prompt.
        const ziel = new URLSearchParams({ prompt: image.prompt ?? '', seed: String(image.seed) });
        if (image.model) ziel.set('model', image.model);
        if (image.ratio) ziel.set('ratio', image.ratio);
        document.getElementById('seed-again').href = `/index.html?${ziel.toString()}`;
        document.getElementById('seed-line').classList.remove('hidden');
    };

    /**
     * Ohne die Vorlage ist ein Prompt wie „mach den Hintergrund tiefblau" nicht
     * zu deuten — deshalb steht sie hier daneben.
     */
    const zeigeReferenzbilder = (namen) => {
        if (!Array.isArray(namen) || namen.length === 0) return;
        const behaelter = document.getElementById('reference-images');
        behaelter.replaceChildren(...namen.map((name) => {
            const bild = document.createElement('img');
            bild.src = `/api/files/reference/${name}`;
            bild.alt = 'Referenzbild';
            bild.loading = 'lazy';
            bild.className = 'h-24 w-24 object-cover rounded border border-gray-300';
            // Nach einem Import fehlen die Vorlagen — das Archiv enthaelt sie
            // nicht. Dann lieber nichts zeigen als ein kaputtes Bildsymbol.
            bild.addEventListener('error', () => {
                link.remove();
                if (!behaelter.children.length) {
                    document.getElementById('reference-block').classList.add('hidden');
                }
            });

            const link = document.createElement('a');
            link.href = `/api/files/reference/${name}`;
            link.target = '_blank';
            link.rel = 'noopener';
            link.title = 'In voller Größe öffnen';
            link.appendChild(bild);
            return link;
        }));
        document.getElementById('reference-block').classList.remove('hidden');
    };

    /**
     * Nachbarn über denselben Endpunkt wie die Übersicht: `cursor` liefert das,
     * was *nach* einem Namen kommt — dreht man die Sortierung um, ist das der
     * Vorgänger. So bleibt die Reihenfolge dieselbe wie im Raster.
     */
    const zeigeNachbarn = async (fileName) => {
        const hole = async (sorting) => {
            try {
                const params = new URLSearchParams({ limit: '1', sorting, cursor: fileName });
                const response = await fetch(`/api/images?${params}`);
                if (!response.ok) return null;
                return (await response.json()).images[0] ?? null;
            } catch {
                return null;
            }
        };
        const [aelter, neuer] = await Promise.all([hole('DESC'), hole('ASC')]);
        for (const [element, bild] of [['next-image', aelter], ['prev-image', neuer]]) {
            if (!bild) continue;
            const a = document.getElementById(element);
            a.href = `/detail.html?filename=${encodeURIComponent(bild.fileName)}`;
            a.title = bild.prompt || bild.fileName;
            a.classList.remove('hidden');
        }
    };

    document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const filename = urlParams.get('filename');
        if (!filename || filename === '') {
            window.location.href = '/notFound.html'
            return
        }
        const image = await getDetailInformation(filename);
        if (image.errorMsg) {
            console.error('Failed opening detailed view!', image.errorMsg)
            window.location.href = '/notFound.html'
            return
        } else {
            document.getElementById('image').src = `/big-thumbnails/${image.filename}`
            document.getElementById('prompt').textContent = image.prompt;
            document.getElementById('revised-prompt').textContent = image.revisedPrompt;
            document.getElementById('filename').textContent = image.filename;
            document.getElementById('created').textContent = image.createdAt;
            document.getElementById('anchor').href = `/api/files/download/${image.filename}`
            document.getElementById('download-link').href = `/api/files/download/${image.filename}`
            // Der Generator holt sich das Bild anhand des Namens selbst.
            document.getElementById('use-as-reference').href =
                `/index.html?reference=${encodeURIComponent(image.filename)}`

            const groesse = image.width && image.height ? ` · ${image.width}×${image.height}` : '';
            const verhaeltnis = image.ratio ? ` · ${image.ratio}` : '';
            document.getElementById('model').textContent = (image.model || 'unbekannt') + verhaeltnis + groesse;

            zeigeReferenzbilder(image.referenceImages);
            zeigeEinstellungen(image);
            zeigeNachbarn(image.filename ?? filename);

            const kopiere = (text, name) => async () => {
                try {
                    await navigator.clipboard.writeText(text ?? '');
                    showToast(`${name} kopiert`);
                } catch {
                    // In unsicheren Kontexten (http) gibt es keine Zwischenablage.
                    showToast('Kopieren ging nicht — bitte von Hand markieren');
                }
            };
            document.getElementById('copy-prompt')
                .addEventListener('click', kopiere(image.prompt, 'Prompt'));

            const revidiert = image.revisedPrompt;
            const revidiertKnopf = document.getElementById('copy-revised');
            // Ohne eigenen revidierten Prompt gibt es nichts zu kopieren, was
            // nicht schon oben stünde.
            if (!revidiert || revidiert === 'unknown' || revidiert === image.prompt) {
                revidiertKnopf.classList.add('hidden');
            } else {
                revidiertKnopf.addEventListener('click', kopiere(revidiert, 'Revidierter Prompt'));
            }

            zeigeFavorit(image);

            document.getElementById('delete-image').addEventListener('click', async () => {
                if (!window.confirm('Dieses Bild wirklich löschen? Das lässt sich nicht rückgängig machen.')) return;
                try {
                    const response = await fetch(`/api/files/${encodeURIComponent(image.filename)}`, { method: 'DELETE' });
                    if (!response.ok) throw new Error(`Fehler ${response.status}`);
                    // Zurück in die Übersicht — hier gibt es nichts mehr zu sehen.
                    window.location.href = '/overview.html';
                } catch (error) {
                    showToast(`Löschen fehlgeschlagen: ${error.message}`);
                }
            });
        }
        spinnerOverlay.classList.add('hidden')
    });

</script>

</body>
</html>
