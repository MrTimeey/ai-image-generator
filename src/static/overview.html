<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator</title>
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/public/favicon_io/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/public/favicon_io/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/public/favicon_io/favicon-16x16.png" />
    <link rel="manifest" href="/public/favicon_io/site.webmanifest" />
    <meta name="theme-color" content="#2563eb">
    <script>
        // Nur ueber https oder localhost — sonst verweigert der Browser die
        // Registrierung ohnehin und wirft eine Konsolenmeldung.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch((error) =>
                    console.debug('Service Worker nicht registriert', error));
            });
        }
    </script>
    <script src="/js/main.js" defer></script>
    <script src="/public/js/nav.js" defer></script>
    <link href="/public/css/generated-tailwind.css" rel="stylesheet">
    <link href="/public/css/style.css" rel="stylesheet">
    <style>
        /**
         * Das Raster fuellt die Breite selbst auf, statt feste Spaltenzahlen je
         * Bildschirmgroesse vorzugeben. Vorher stand auf dem Handy
         * `grid-cols-1` — ein einziges 200-px-Bild pro Zeile, bei dem der
         * halbe Bildschirm leer blieb.
         */
        #thumbnail-grid {
            display: grid;
            /**
             * `min(…, 45%)` deckelt die Kachel auf dem Handy: ohne das faellt
             * die groesste Stufe dort auf eine einzige Spalte zurueck — genau
             * der Zustand, der vorher gestoert hat. So bleiben es immer
             * mindestens zwei.
             */
            grid-template-columns: repeat(auto-fill, minmax(min(var(--tile, 150px), 45%), 1fr));
            gap: 0.5rem;
        }

        .thumbnail {
            /* Quadratisch ueber das Seitenverhaeltnis, nicht ueber feste Pixel:
               so waechst die Kachel mit der Spalte mit. */
            aspect-ratio: 1 / 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #e5e7eb;
        }

        .thumbnail img {
            /**
             * `width`/`height` statt `max-*`: als Flex-Element bezieht sich
             * `max-height: 100%` auf eine Hoehe, die hier gar nicht feststeht —
             * Hochformat-Bilder wurden dadurch hoeher als ihre Kachel und oben
             * wie unten abgeschnitten. Mit fester Groesse plus `contain` passt
             * jedes Seitenverhaeltnis hinein.
             */
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #confirm-modal {
            display: none; /* Initially hidden */
        }
        /* Ohne Mauszeiger gibt es kein Hover — dort müssen die Symbole stehen. */
        @media (hover: none) {
            .action-icon {
                display: block !important;
            }
        }

        /**
         * Der Favoritenstern: gesetzt bleibt er immer sichtbar, ungesetzt
         * erscheint er nur unter dem Mauszeiger. Auf Touch-Geräten gibt es
         * kein Hover — dort steht er dauerhaft, sonst führte kein Weg zu ihm.
         */
        .favorite-icon { opacity: 1; transition: opacity 0.12s; }
        @media (hover: hover) {
            .favorite-icon:not(.is-favorite) { opacity: 0; }
            .thumbnail:hover .favorite-icon:not(.is-favorite) { opacity: 1; }
            .favorite-icon:focus-visible { opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-100">

<!-- Spinner Overlay -->
<div id="spinner-overlay" class="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center z-50">
    <div class="w-16 h-16 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
</div>

<header class="bg-blue-600 text-white">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
        <!-- Logo und Titel -->
        <div class="text-2xl font-bold">
            <a href="/index.html">AI Image Generator</a>
        </div>

        <!-- Navigation (Desktop) -->
        <nav id="nav-desktop" class="hidden md:flex space-x-6 items-center"></nav>

        <!-- Burger Menu Button (Mobile) -->
        <div class="md:hidden">
            <button id="burger-btn" class="focus:outline-none">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Navigation (Mobile) -->
    <nav id="mobile-menu" class="hidden bg-blue-600 md:hidden px-4 py-4">
        <div id="nav-mobile"></div>
    </nav>
</header>

<main class="max-w-6xl mx-auto py-6 px-4">

    <!-- Suche und Filter -->
    <div class="bg-white rounded-lg shadow p-4 mb-4">
        <div class="flex flex-wrap gap-3 items-end">
            <div class="flex-1 min-w-[14rem]">
                <label for="search" class="block text-sm font-medium text-gray-700 mb-1">Suche</label>
                <input id="search" type="search" placeholder="im Prompt suchen&hellip;"
                       class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600">
            </div>
            <div>
                <label for="filter-model" class="block text-sm font-medium text-gray-700 mb-1">Modell</label>
                <select id="filter-model" class="p-2 border border-gray-300 rounded-lg"><option value="">alle</option></select>
            </div>
            <div>
                <label for="filter-ratio" class="block text-sm font-medium text-gray-700 mb-1">Verh&auml;ltnis</label>
                <select id="filter-ratio" class="p-2 border border-gray-300 rounded-lg"><option value="">alle</option></select>
            </div>
            <label class="flex items-center gap-2 text-sm text-gray-700 pb-2">
                <input type="checkbox" id="filter-favorite" class="rounded border-gray-300">
                nur Favoriten
            </label>
            <button id="filter-reset" class="hidden text-sm text-blue-600 hover:underline pb-2">zur&uuml;cksetzen</button>
        </div>
    </div>

    <!-- Werkzeugleiste -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div class="flex items-center gap-4">
            <button id="sort-toggle" class="flex items-center gap-1 text-blue-600 hover:underline">
                <span id="sort-label"></span>
                <svg id="sort-icon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M5.293 9.293a1 1 0 011.414 0L10 12.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </button>
            <span id="result-count" class="text-sm text-gray-600"></span>
        </div>

        <div class="flex items-center gap-2">
            <button id="select-mode" class="text-sm text-blue-600 hover:underline">Ausw&auml;hlen</button>
            <span class="text-sm text-gray-600">Raster</span>
            <div id="tile-size" class="inline-flex rounded-lg border border-gray-300 overflow-hidden bg-white">
                <button data-tile="90" class="px-3 py-1 text-sm hover:bg-gray-100" title="viele kleine Bilder">S</button>
                <button data-tile="150" class="px-3 py-1 text-sm border-l border-gray-300 hover:bg-gray-100">M</button>
                <button data-tile="240" class="px-3 py-1 text-sm border-l border-gray-300 hover:bg-gray-100" title="wenige große Bilder">L</button>
            </div>
        </div>
    </div>

    <!-- Auswahlleiste, bleibt beim Scrollen sichtbar -->
    <!--
      Auf dem Handy kurze Beschriftungen: mit den langen brach die Leiste auf
      drei Zeilen um und nahm 128 px vom Bildschirm — bei einer Leiste, die
      beim Scrollen stehen bleibt, ist das zu viel.
    -->
    <div id="selection-bar" class="hidden sticky top-0 z-30 bg-blue-600 text-white rounded-lg px-3 py-2 mb-4 flex flex-wrap items-center gap-x-3 gap-y-2">
        <span id="selection-count" class="font-medium"></span>
        <button id="select-page" class="text-sm underline hover:no-underline">
            <span class="sm:hidden">alle</span><span class="hidden sm:inline">alle auf dieser Seite</span>
        </button>
        <button id="select-none" class="text-sm underline hover:no-underline">
            <span class="sm:hidden">keine</span><span class="hidden sm:inline">Auswahl aufheben</span>
        </button>
        <!-- Der Abstandhalter schiebt die Aktionen nur dort nach rechts, wo Platz ist. -->
        <div class="hidden sm:block flex-1"></div>
        <button id="selection-download" class="bg-white text-blue-700 px-3 py-1 rounded text-sm hover:bg-blue-50">
            <span class="sm:hidden">ZIP</span><span class="hidden sm:inline">Herunterladen</span>
        </button>
        <button id="selection-delete" class="bg-red-600 px-3 py-1 rounded text-sm hover:bg-red-700">L&ouml;schen</button>
        <button id="select-exit" class="text-sm underline hover:no-underline" title="Auswahlmodus beenden">
            <span class="sm:hidden">&times;</span><span class="hidden sm:inline">Fertig</span>
        </button>
    </div>

    <div id="thumbnail-grid"></div>

    <p id="empty-hint" class="hidden text-center text-gray-500 py-10">Keine Bilder gefunden.</p>
    <div id="load-more" class="h-16 flex items-center justify-center text-sm text-gray-500"></div>
</main>

<!-- Bestätigungsdialog -->
<div id="confirm-modal" class="fixed inset-0 flex items-center justify-center bg-gray-800 bg-opacity-75 z-50">
    <div class="bg-white rounded-lg p-6 w-96">
        <h2 class="text-xl font-bold mb-4">Wirklich löschen?</h2>
        <p id="confirm-text">Dieses Bild wirklich löschen?</p>
        <div class="flex justify-end mt-4">
            <button id="cancel-delete" class="bg-gray-300 text-gray-800 px-4 py-2 rounded mr-2">Abbrechen</button>
            <button id="confirm-delete" class="bg-red-600 text-white px-4 py-2 rounded">Löschen</button>
        </div>
    </div>
</div>

<script>
    const grid = document.getElementById('thumbnail-grid');
    const spinnerOverlay = document.getElementById('spinner-overlay');
    const confirmModal = document.getElementById('confirm-modal');
    const ladeBereich = document.getElementById('load-more');
    const leerHinweis = document.getElementById('empty-hint');
    const trefferAnzeige = document.getElementById('result-count');
    const auswahlLeiste = document.getElementById('selection-bar');
    const auswahlAnzahl = document.getElementById('selection-count');

    /** Alles, was die aktuelle Ansicht ausmacht. */
    let abfrage = { q: '', model: '', ratio: '', favorite: false, sorting: 'DESC' };
    let cursor = null;
    let ladend = false;
    let auswahlModus = false;
    const ausgewaehlt = new Set();
    /** Reihenfolge im Raster — für die Bereichsauswahl mit Umschalt. */
    let reihenfolge = [];
    let letzteKachel = null;

    // --- Kachelgröße (unverändert) -----------------------------------------

    const TILE_KEY = 'aig.tileSize';
    const DEFAULT_TILE = '150';

    const applyTile = (value) => {
        document.documentElement.style.setProperty('--tile', `${value}px`);
        for (const button of document.querySelectorAll('#tile-size button')) {
            const active = button.dataset.tile === value;
            button.classList.toggle('bg-blue-600', active);
            button.classList.toggle('text-white', active);
            button.classList.toggle('hover:bg-gray-100', !active);
        }
    };

    const storedTile = () => {
        try {
            return localStorage.getItem(TILE_KEY) ?? DEFAULT_TILE;
        } catch {
            // Privates Fenster oder blockierte Speicherung — dann eben Standard.
            return DEFAULT_TILE;
        }
    };

    applyTile(storedTile());

    document.getElementById('tile-size').addEventListener('click', (event) => {
        const value = event.target.closest('button')?.dataset.tile;
        if (!value) return;
        applyTile(value);
        try {
            localStorage.setItem(TILE_KEY, value);
        } catch {
            // Nicht speicherbar ist kein Grund, die Ansicht nicht umzustellen.
        }
    });

    // --- Kacheln ------------------------------------------------------------

    const kachel = (image) => {
        const div = document.createElement('div');
        div.className = 'thumbnail relative group';
        div.dataset.name = image.fileName;

        const img = document.createElement('img');
        img.src = `/thumbnails/${image.fileName}`;
        img.alt = image.prompt || image.fileName;
        // Der Prompt als Tooltip — beim Suchen will man sehen, was man gefunden hat.
        img.title = image.prompt || image.fileName;
        img.loading = 'lazy';
        img.decoding = 'async';

        const link = document.createElement('a');
        link.href = `/detail.html?filename=${encodeURIComponent(image.fileName)}`;
        link.appendChild(img);
        div.appendChild(link);

        // Favoritenstern
        const stern = document.createElement('button');
        /**
         * **Immer sichtbar, nicht nur bei Hover.** Auf Touch-Geräten gibt es
         * kein Hover — dort war der Stern vorher gar nicht erreichbar. Ohne
         * Markierung bleibt er dezent, damit er das Bild nicht überlagert.
         */
        stern.className = 'favorite-icon absolute bottom-1 left-1 h-7 w-7 rounded-full bg-white/85 shadow text-base leading-none';
        stern.type = 'button';
        zeichneStern(stern, Boolean(image.favorite));
        stern.addEventListener('click', async (event) => {
            event.preventDefault();
            event.stopPropagation();
            await favoritUmschalten(image, stern);
        });
        div.appendChild(stern);

        // Löschen einzeln
        const loeschen = document.createElement('div');
        loeschen.className = 'action-icon hidden group-hover:block absolute top-1 right-1 bg-white/90 rounded-full p-0.5 cursor-pointer shadow';
        loeschen.title = 'Bild löschen';
        loeschen.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-red-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>`;
        loeschen.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            frageLoeschen([image.fileName]);
        });
        div.appendChild(loeschen);

        const auswahlHaken = document.createElement('div');
        auswahlHaken.className = 'select-mark hidden absolute inset-0 items-center justify-center bg-blue-600/40';
        auswahlHaken.innerHTML = '<span class="bg-white text-blue-700 rounded-full h-7 w-7 flex items-center justify-center font-bold">✓</span>';
        div.appendChild(auswahlHaken);

        // Nach einem langen Drücken feuert der Browser noch ein `click` — ohne
        // diese Sperre würde er die gerade gewählte Kachel sofort wieder
        // abwählen, und das Auswählen ginge auf dem Handy überhaupt nicht.
        let clickUnterdruecken = false;

        div.addEventListener('click', (event) => {
            if (clickUnterdruecken) {
                clickUnterdruecken = false;
                event.preventDefault();
                return;
            }
            if (!auswahlModus) return;
            // Im Auswahlmodus wählt der Klick aus, statt zu öffnen.
            event.preventDefault();
            waehle(div, event.shiftKey);
        });

        /**
         * Langes Drücken startet die Auswahl — auf dem Handy gibt es weder
         * Umschalt-Klick noch einen bequemen Weg zum Knopf in der Leiste.
         * Das Muster kennt man aus jeder Galerie-App.
         */
        let druckTimer;
        const starteDruck = () => {
            druckTimer = setTimeout(() => {
                if (!auswahlModus) setzeAuswahlModus(true);
                waehle(div, false);
                clickUnterdruecken = true;
                // Kurze Rückmeldung, sonst wirkt es wie ein Fehlgriff.
                if (navigator.vibrate) navigator.vibrate(15);
            }, 450);
        };
        const beendeDruck = () => clearTimeout(druckTimer);
        div.addEventListener('touchstart', starteDruck, { passive: true });
        for (const ereignis of ['touchend', 'touchmove', 'touchcancel']) {
            div.addEventListener(ereignis, beendeDruck, { passive: true });
        }
        // Das Kontextmenü würde das lange Drücken sonst überlagern.
        div.addEventListener('contextmenu', (event) => {
            if (auswahlModus) event.preventDefault();
        });

        return div;
    };

    const zeichneStern = (stern, gesetzt) => {
        stern.textContent = gesetzt ? '★' : '☆';
        stern.title = gesetzt ? 'Favorit aufheben' : 'Als Favorit markieren';
        stern.classList.toggle('text-amber-500', gesetzt);
        stern.classList.toggle('text-gray-500', !gesetzt);
        // Ob er zu sehen ist, entscheidet das CSS oben — hier nur der Zustand.
        stern.classList.toggle('is-favorite', gesetzt);
    };

    const favoritUmschalten = async (image, stern) => {
        const neu = !image.favorite;
        try {
            const response = await fetch(`/api/files/${encodeURIComponent(image.fileName)}/favorite`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ favorite: neu }),
            });
            if (!response.ok) {
                const daten = await response.json().catch(() => ({}));
                showToast(daten.message ?? 'Markieren fehlgeschlagen');
                return;
            }
            image.favorite = neu;
            zeichneStern(stern, neu);
        } catch (error) {
            showToast(`Markieren fehlgeschlagen: ${error.message}`);
        }
    };

    // --- Laden --------------------------------------------------------------

    const abfrageParameter = () => {
        const params = new URLSearchParams({ limit: '100', sorting: abfrage.sorting });
        if (abfrage.q) params.set('q', abfrage.q);
        if (abfrage.model) params.set('model', abfrage.model);
        if (abfrage.ratio) params.set('ratio', abfrage.ratio);
        if (abfrage.favorite) params.set('favorite', 'true');
        if (cursor) params.set('cursor', cursor);
        return params;
    };

    const ladeSeite = async () => {
        if (ladend) return;
        ladend = true;
        ladeBereich.textContent = 'lädt…';
        try {
            const response = await fetch(`/api/images?${abfrageParameter()}`);
            if (response.status === 401) {
                window.location.href = `/auth/login?next=${encodeURIComponent(window.location.pathname)}`;
                return;
            }
            if (!response.ok) throw new Error(`Fehler ${response.status}`);
            const daten = await response.json();

            for (const image of daten.images) {
                reihenfolge.push(image.fileName);
                grid.appendChild(kachel(image));
            }
            cursor = daten.nextCursor;
            trefferAnzeige.textContent = `${daten.total} Bild${daten.total === 1 ? '' : 'er'}`;
            leerHinweis.classList.toggle('hidden', daten.total > 0);
            // Ohne Cursor ist der Bestand durch — dann verschwindet der Hinweis.
            ladeBereich.textContent = cursor ? 'mehr laden…' : '';
        } catch (error) {
            ladeBereich.textContent = `Nicht ladbar: ${error.message}`;
        } finally {
            ladend = false;
            spinnerOverlay.classList.add('hidden');
        }
    };

    const neuLaden = () => {
        cursor = null;
        reihenfolge = [];
        ausgewaehlt.clear();
        zeigeAuswahl();
        grid.replaceChildren();
        ladeSeite();
    };

    /**
     * Nachladen, sobald der Bereich unter dem Raster in Sicht kommt. Ein
     * Beobachter statt eines Scroll-Handlers: der feuert nur, wenn es nötig ist.
     */
    new IntersectionObserver((eintraege) => {
        if (eintraege.some(e => e.isIntersecting) && cursor && !ladend) ladeSeite();
    }, { rootMargin: '400px' }).observe(ladeBereich);

    // --- Suche und Filter ---------------------------------------------------

    let tippPause;
    document.getElementById('search').addEventListener('input', (event) => {
        // Entprellt: sonst löst jeder Tastendruck eine Abfrage aus.
        clearTimeout(tippPause);
        tippPause = setTimeout(() => {
            abfrage.q = event.target.value.trim();
            zeigeZuruecksetzen();
            neuLaden();
        }, 300);
    });

    for (const [id, feld] of [['filter-model', 'model'], ['filter-ratio', 'ratio']]) {
        document.getElementById(id).addEventListener('change', (event) => {
            abfrage[feld] = event.target.value;
            zeigeZuruecksetzen();
            neuLaden();
        });
    }

    document.getElementById('filter-favorite').addEventListener('change', (event) => {
        abfrage.favorite = event.target.checked;
        zeigeZuruecksetzen();
        neuLaden();
    });

    const zeigeZuruecksetzen = () => {
        const aktiv = Boolean(abfrage.q || abfrage.model || abfrage.ratio || abfrage.favorite);
        document.getElementById('filter-reset').classList.toggle('hidden', !aktiv);
    };

    document.getElementById('filter-reset').addEventListener('click', () => {
        abfrage = { ...abfrage, q: '', model: '', ratio: '', favorite: false };
        document.getElementById('search').value = '';
        document.getElementById('filter-model').value = '';
        document.getElementById('filter-ratio').value = '';
        document.getElementById('filter-favorite').checked = false;
        zeigeZuruecksetzen();
        neuLaden();
    });

    document.getElementById('sort-toggle').addEventListener('click', () => {
        abfrage.sorting = abfrage.sorting === 'DESC' ? 'ASC' : 'DESC';
        zeigeSortierung();
        neuLaden();
    });

    const zeigeSortierung = () => {
        const aufsteigend = abfrage.sorting === 'ASC';
        document.getElementById('sort-label').textContent = aufsteigend ? 'Älteste zuerst' : 'Neueste zuerst';
        document.getElementById('sort-icon').style.transform = aufsteigend ? 'rotate(180deg)' : '';
    };

    // --- Mehrfachauswahl ----------------------------------------------------

    const waehle = (div, mitBereich) => {
        const name = div.dataset.name;
        if (mitBereich && letzteKachel) {
            // Umschalt-Klick wählt die Spanne dazwischen — wie im Dateimanager.
            const von = reihenfolge.indexOf(letzteKachel);
            const bis = reihenfolge.indexOf(name);
            if (von !== -1 && bis !== -1) {
                for (const n of reihenfolge.slice(Math.min(von, bis), Math.max(von, bis) + 1)) ausgewaehlt.add(n);
                zeigeAuswahl();
                return;
            }
        }
        if (ausgewaehlt.has(name)) ausgewaehlt.delete(name);
        else ausgewaehlt.add(name);
        letzteKachel = name;
        zeigeAuswahl();
    };

    const zeigeAuswahl = () => {
        for (const div of grid.children) {
            const gewaehlt = ausgewaehlt.has(div.dataset.name);
            div.querySelector('.select-mark')?.classList.toggle('hidden', !gewaehlt);
            div.querySelector('.select-mark')?.classList.toggle('flex', gewaehlt);
        }
        auswahlAnzahl.textContent = `${ausgewaehlt.size} ausgewählt`;
        for (const id of ['selection-download', 'selection-delete']) {
            document.getElementById(id).disabled = ausgewaehlt.size === 0;
            document.getElementById(id).classList.toggle('opacity-50', ausgewaehlt.size === 0);
        }
    };

    const setzeAuswahlModus = (an) => {
        auswahlModus = an;
        auswahlLeiste.classList.toggle('hidden', !an);
        grid.classList.toggle('cursor-pointer', an);
        document.getElementById('select-mode').textContent = an ? 'Auswahl beenden' : 'Auswählen';
        if (!an) {
            ausgewaehlt.clear();
            letzteKachel = null;
        }
        zeigeAuswahl();
    };

    document.getElementById('select-mode').addEventListener('click', () => setzeAuswahlModus(!auswahlModus));
    document.getElementById('select-exit').addEventListener('click', () => setzeAuswahlModus(false));
    document.getElementById('select-none').addEventListener('click', () => {
        ausgewaehlt.clear();
        zeigeAuswahl();
    });
    document.getElementById('select-page').addEventListener('click', () => {
        for (const name of reihenfolge) ausgewaehlt.add(name);
        zeigeAuswahl();
    });

    document.getElementById('selection-download').addEventListener('click', async () => {
        if (ausgewaehlt.size === 0) return;
        showToast(`${ausgewaehlt.size} Bild(er) werden gepackt…`);
        try {
            const response = await fetch('/api/exchange/selection', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fileNames: [...ausgewaehlt] }),
            });
            if (!response.ok) throw new Error(`Fehler ${response.status}`);
            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `auswahl-${ausgewaehlt.size}.zip`;
            a.click();
            URL.revokeObjectURL(url);
        } catch (error) {
            showToast(`Herunterladen fehlgeschlagen: ${error.message}`);
        }
    });

    document.getElementById('selection-delete').addEventListener('click', () => {
        if (ausgewaehlt.size > 0) frageLoeschen([...ausgewaehlt]);
    });

    // --- Löschen ------------------------------------------------------------

    let zuLoeschen = [];

    const frageLoeschen = (namen) => {
        zuLoeschen = namen;
        document.getElementById('confirm-text').textContent =
            namen.length === 1
                ? 'Dieses Bild wirklich löschen? Das lässt sich nicht rückgängig machen.'
                : `${namen.length} Bilder wirklich löschen? Das lässt sich nicht rückgängig machen.`;
        confirmModal.style.display = 'flex';
    };

    document.getElementById('cancel-delete').addEventListener('click', () => {
        confirmModal.style.display = 'none';
        zuLoeschen = [];
    });

    document.getElementById('confirm-delete').addEventListener('click', async () => {
        confirmModal.style.display = 'none';
        if (zuLoeschen.length === 0) return;
        const namen = zuLoeschen;
        zuLoeschen = [];
        try {
            const response = await fetch('/api/files/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fileNames: namen }),
            });
            const daten = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(daten.message ?? `Fehler ${response.status}`);

            /**
             * **Erst nach der Antwort** aus dem Raster nehmen. Vorher wurde die
             * Kachel unbedingt entfernt und der Fehler verschluckt — schlug das
             * Löschen fehl, war das Bild optisch weg und nach dem Neuladen
             * wieder da.
             */
            for (const name of namen) {
                grid.querySelector(`[data-name="${CSS.escape(name)}"]`)?.remove();
                ausgewaehlt.delete(name);
                reihenfolge = reihenfolge.filter(n => n !== name);
            }
            zeigeAuswahl();
            showToast(`${daten.deleted ?? namen.length} Bild(er) gelöscht`);
        } catch (error) {
            showToast(`Löschen fehlgeschlagen: ${error.message}`);
        }
    });

    // --- Start --------------------------------------------------------------

    const fuelleFilter = async () => {
        try {
            const registry = await (await fetch('/api/models')).json();
            const modelle = document.getElementById('filter-model');
            for (const model of registry.models) {
                const option = document.createElement('option');
                option.value = model.id;
                option.textContent = model.label;
                modelle.appendChild(option);
            }
            // Die Verhältnisse aller Modelle, ohne Doppelte.
            const verhaeltnisse = [...new Set(registry.models.flatMap(m => m.ratios))];
            const ratios = document.getElementById('filter-ratio');
            for (const ratio of verhaeltnisse) {
                const option = document.createElement('option');
                option.value = ratio;
                option.textContent = ratio;
                ratios.appendChild(option);
            }
        } catch (error) {
            console.debug('Filterwerte nicht ladbar', error);
        }
    };

    document.addEventListener('DOMContentLoaded', async () => {
        const params = new URLSearchParams(window.location.search);
        abfrage.sorting = params.get('sorting') === 'ASC' ? 'ASC' : 'DESC';
        if (params.get('q')) {
            abfrage.q = params.get('q');
            document.getElementById('search').value = abfrage.q;
        }
        zeigeSortierung();
        zeigeZuruecksetzen();
        await fuelleFilter();
        await ladeSeite();
    });
</script>

</body>
</html>
